name: Build Bhatwala APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable         

      - name: Extract project ZIP
        run: |
          mkdir extracted
          unzip -q *.zip -d extracted

      - name: Find Flutter project
        run: |
          PROJECT=$(find extracted -name pubspec.yaml -type f -print -quit | xargs dirname)
          echo "PROJECT=$PROJECT" >> $GITHUB_ENV

      - name: Get dependencies
        run: |
          cd "$PROJECT"
          flutter pub get

      - name: Build APK
        run: |
          cd "$PROJECT"
          flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Bhatwala-APK
          path: ${{ env.PROJECT }}/build/app/outputs/flutter-apk/app-release.apk
